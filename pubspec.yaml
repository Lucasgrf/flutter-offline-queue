name: resilient_offline_queue
description: A clean, modular, and robust offline synchronization queue for Flutter/Dart applications. Implements persistent FIFO queues, exponential backoff with jitter, and storage adapters.
version: 1.0.0
homepage: https://github.com/Lucasgrf/flutter-offline-queue
repository: https://github.com/Lucasgrf/flutter-offline-queue

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  meta: ^1.11.0

dev_dependencies:
  test: ^1.24.0
  mockito: ^5.4.4
